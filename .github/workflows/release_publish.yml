name: Release / Publish

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      artifact-id:
        required: true
        type: string
    secrets:
      BINARY_REPO_PAT:
        required: true
      COPILOT_GITHUB_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  assets:
    name: Prepare release assets
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.prepare.outputs.plan }}
      manifest: ${{ steps.prepare.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: release-artifacts
      - name: Verify artifacts and prepare the draft
        id: prepare
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.ref }}
        with:
          script: |
            const { prepareRelease } = require('./Scripts/CI/release.js');
            const plan = await prepareRelease({
              github, repo: context.repo, version: process.env.VERSION,
              sha: process.env.CANDIDATE_SHA, directory: 'release-artifacts',
            });
            core.setOutput('plan', JSON.stringify(plan));
            core.setOutput('manifest', JSON.stringify(plan.manifest));
            core.setOutput('missing', JSON.stringify(plan.missing));
      - name: Upload missing assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          MISSING_ASSETS: ${{ steps.prepare.outputs.missing }}
        shell: bash
        run: |
          mapfile -t release_assets < <(jq -r '.[] | "release-artifacts/" + .' <<< "$MISSING_ASSETS")
          if [[ ${#release_assets[@]} -gt 0 ]]; then
            gh release upload "$VERSION" "${release_assets[@]}"
          fi

  notes:
    needs: assets
    uses: ./.github/workflows/release_notes.yml
    with:
      tag-name: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  publish:
    name: Publish the complete release
    needs: [assets, notes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify uploaded assets and publish
        uses: actions/github-script@v7
        env:
          RELEASE_PLAN: ${{ needs.assets.outputs.plan }}
        with:
          script: |
            const { publishRelease } = require('./Scripts/CI/release.js');
            await publishRelease({ github, repo: context.repo, plan: JSON.parse(process.env.RELEASE_PLAN) });

  binary:
    name: Update OpenSwiftUI-spm
    needs: [assets, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenSwiftUIProject/OpenSwiftUI-spm
          ref: main
          path: binary-repo
          fetch-depth: 0
          token: ${{ secrets.BINARY_REPO_PAT }}
      - name: Update package and create the matching tag
        env:
          RELEASE_MANIFEST: ${{ needs.assets.outputs.manifest }}
          VERSION: ${{ inputs.version }}
        run: bash Scripts/CI/update_binary_package.sh "$PWD" "$PWD/binary-repo"
