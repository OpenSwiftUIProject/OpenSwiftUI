name: Prepare snapshot tests

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      status-context-prefix:
        required: true
        type: string
      ref:
        default: ''
        type: string
      platform:
        default: all
        type: string
      configuration:
        default: default
        type: string
      update_reference:
        default: false
        type: boolean
      only-testing:
        default: ''
        type: string
    outputs:
      repository:
        value: ${{ jobs.prepare.outputs.repository }}
      ref:
        value: ${{ jobs.prepare.outputs.ref }}
      ios-requested:
        value: ${{ jobs.prepare.outputs.ios-requested }}
      macos-requested:
        value: ${{ jobs.prepare.outputs.macos-requested }}
      update-reference:
        value: ${{ jobs.prepare.outputs.update-reference }}
      only-testing:
        value: ${{ jobs.prepare.outputs.only-testing }}
      status-enabled:
        value: ${{ jobs.prepare.outputs.status-enabled }}
      configuration-matrix:
        value: ${{ jobs.prepare.outputs.configuration-matrix }}

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  prepare:
    name: Prepare snapshot tests
    if: >-
      (inputs.ref != '' && github.event_name != 'issue_comment') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       contains(github.event.comment.body, inputs.command))
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.prepare.outputs.repository }}
      ref: ${{ steps.prepare.outputs.ref }}
      ios-requested: ${{ steps.prepare.outputs.ios-requested }}
      macos-requested: ${{ steps.prepare.outputs.macos-requested }}
      update-reference: ${{ steps.prepare.outputs.update-reference }}
      only-testing: ${{ steps.prepare.outputs.only-testing }}
      status-enabled: ${{ steps.prepare.outputs.status-enabled }}
      configuration-matrix: ${{ steps.prepare.outputs.configuration-matrix }}
    steps:
      - name: Prepare requested snapshot tests
        id: prepare
        uses: actions/github-script@v7
        env:
          COMMAND: ${{ inputs.command }}
          STATUS_CONTEXT_PREFIX: ${{ inputs.status-context-prefix }}
          REQUESTED_REF: ${{ inputs.ref || '' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          CONFIGURATION: ${{ inputs.configuration || 'default' }}
          UPDATE_REFERENCE: ${{ inputs.update_reference && 'true' || 'false' }}
          UITEST_ONLY_TESTING: ${{ inputs.only-testing || '' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const command = process.env.COMMAND;
            const statusPrefix = process.env.STATUS_CONTEXT_PREFIX;
            const allowedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const configurations = {
              "swiftui-renderer-ag": {
                id: "swiftui-renderer-ag",
                swiftui_renderer: 1,
                attributegraph: 1,
                compute: 0,
              },
              "swiftui-renderer-iag": {
                id: "swiftui-renderer-iag",
                swiftui_renderer: 1,
                attributegraph: 0,
                compute: 1,
              },
              "openswiftui-renderer-ag": {
                id: "openswiftui-renderer-ag",
                swiftui_renderer: 0,
                attributegraph: 1,
                compute: 0,
              },
              "openswiftui-renderer-iag": {
                id: "openswiftui-renderer-iag",
                swiftui_renderer: 0,
                attributegraph: 0,
                compute: 1,
              },
            };
            const configurationAliases = {
              "all-configs": "all",
              "sui-ag": "swiftui-renderer-ag",
              "sui-iag": "swiftui-renderer-iag",
              "osui-ag": "openswiftui-renderer-ag",
              "osui-iag": "openswiftui-renderer-iag",
            };
            const defaultConfigurationIds = [
              "swiftui-renderer-ag",
              "openswiftui-renderer-iag",
            ];
            const allConfigurationIds = [
              "swiftui-renderer-ag",
              "swiftui-renderer-iag",
              "openswiftui-renderer-ag",
              "openswiftui-renderer-iag",
            ];
            const outputs = {
              repository: "",
              ref: "",
              "ios-requested": "false",
              "macos-requested": "false",
              "update-reference": "false",
              "only-testing": "",
              "status-enabled": "false",
              "configuration-matrix": JSON.stringify(defaultConfigurationIds.map((id) => configurations[id])),
            };
            const setOutputs = () => {
              for (const [name, value] of Object.entries(outputs)) {
                core.setOutput(name, value);
              }
            };
            const requestPlatforms = (requested) => {
              if (requested === "all") {
                return ["ios", "macos"];
              }
              if (requested === "ios" || requested === "macos") {
                return [requested];
              }
              return [];
            };
            const requestConfigurations = (requested) => {
              const normalized = configurationAliases[requested] ?? requested;
              if (normalized === "default") {
                return defaultConfigurationIds.map((id) => configurations[id]);
              }
              if (normalized === "all") {
                return allConfigurationIds.map((id) => configurations[id]);
              }
              if (configurations[normalized]) {
                return [configurations[normalized]];
              }
              return [];
            };
            const applyRequest = (platforms, configurationMatrix, updateRequested, onlyTesting = "") => {
              outputs["ios-requested"] = String(platforms.includes("ios"));
              outputs["macos-requested"] = String(platforms.includes("macos"));
              outputs["update-reference"] = String(updateRequested);
              outputs["only-testing"] = onlyTesting;
              outputs["configuration-matrix"] = JSON.stringify(configurationMatrix);
            };

            const requestedRef = process.env.REQUESTED_REF || "";
            if (context.eventName !== "issue_comment" && (requestedRef || context.eventName === "workflow_dispatch")) {
              if (requestedRef && (requestedRef.length !== 40 || !/^[0-9a-f]+$/.test(requestedRef))) {
                throw new Error("Reusable CI requires a full commit SHA.");
              }
              const platforms = requestPlatforms(process.env.PLATFORM);
              const configurationMatrix = requestConfigurations(process.env.CONFIGURATION);
              if (platforms.length === 0 || configurationMatrix.length === 0) {
                setOutputs();
                return;
              }
              outputs.repository = `${owner}/${repo}`;
              outputs.ref = requestedRef || context.sha;
              applyRequest(platforms, configurationMatrix, process.env.UPDATE_REFERENCE === "true", (process.env.UITEST_ONLY_TESTING ?? "").trim());
              setOutputs();
              return;
            }

            const issue = context.payload.issue;
            const comment = context.payload.comment;
            if (
              context.eventName !== "issue_comment" ||
              !issue?.pull_request ||
              !comment ||
              !allowedAssociations.has(comment.author_association)
            ) {
              setOutputs();
              return;
            }

            const body = comment.body.trim();
            const args = body.split(/\s+/);
            if (args[0] !== command) {
              setOutputs();
              return;
            }

            let updateRequested = false;
            let requestedPlatform = "all";
            let requestedConfiguration = "default";
            let requestedOnlyTesting = "";
            for (const rawArg of args.slice(1)) {
              const arg = rawArg.toLowerCase();
              if (arg === "update") {
                updateRequested = true;
              } else if (arg === "ios" || arg === "macos" || arg === "all") {
                requestedPlatform = arg;
              } else if (arg.startsWith("config=") || arg.startsWith("configuration=")) {
                requestedConfiguration = arg.split("=", 2)[1] || "default";
              } else if (arg.startsWith("only-testing=")) {
                requestedOnlyTesting = rawArg.slice("only-testing=".length);
                if (!requestedOnlyTesting) {
                  core.warning(`Ignoring ${command} command with an empty only-testing identifier.`);
                  setOutputs();
                  return;
                }
              } else if (
                arg === "default" ||
                arg === "all-configs" ||
                configurations[arg] ||
                configurationAliases[arg]
              ) {
                requestedConfiguration = arg;
              } else {
                core.warning(`Ignoring unsupported ${command} argument: ${rawArg}`);
                setOutputs();
                return;
              }
            }

            const platforms = requestPlatforms(requestedPlatform);
            const configurationMatrix = requestConfigurations(requestedConfiguration);
            if (platforms.length === 0 || configurationMatrix.length === 0) {
              setOutputs();
              return;
            }

            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: issue.number });
            if (pull.state !== "open" || !pull.head.repo) {
              core.warning("The requested PR must be open and its head repository must exist.");
              setOutputs();
              return;
            }
            outputs.repository = pull.head.repo.full_name;
            outputs.ref = pull.head.sha;
            applyRequest(platforms, configurationMatrix, updateRequested, requestedOnlyTesting);

            const sameRepository = pull.head.repo.full_name === `${owner}/${repo}`;
            if (!sameRepository) {
              core.warning(`Skipping PR commit status creation for fork PR ${pull.head.repo.full_name}@${pull.head.sha}.`);
              setOutputs();
              return;
            }

            outputs["status-enabled"] = "true";
            const details_url = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            for (const platform of platforms) {
              const label = platform === "ios" ? "iOS" : "macOS";
              for (const configuration of configurationMatrix) {
                const description = `Queued by @${comment.user.login} with ${body}.`.slice(0, 140);
                await github.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha: pull.head.sha,
                  state: "pending",
                  target_url: details_url,
                  description,
                  context: `${statusPrefix} / ${label} / ${configuration.id}${requestedOnlyTesting ? " / Selected" : ""}`,
                });
              }
            }
            setOutputs();
