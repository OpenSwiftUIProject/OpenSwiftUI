name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve legacy release tag
    if: vars.RELEASE_PIPELINE_ENABLED != 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false

  build:
    needs: prepare
    uses: ./.github/workflows/build_release.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ github.ref_name }}
    secrets:
      SIGNING_CERTIFICATE_BASE_64: ${{ secrets.SIGNING_CERTIFICATE_BASE_64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}

  publish:
    needs: [prepare, build]
    uses: ./.github/workflows/publish_release.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ github.ref_name }}
      artifact-id: ${{ needs.build.outputs.artifact-id }}
    secrets:
      BINARY_REPO_PAT: ${{ secrets.BINARY_REPO_PAT }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
