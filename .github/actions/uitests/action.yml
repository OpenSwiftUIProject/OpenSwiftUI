name: Run UI Tests
description: Execute hosted snapshot tests and collect failure artifacts

inputs:
  xcode-version:
    description: 'Xcode version to use'
    required: false
    default: '26.6'
  platform:
    description: 'Platform to test (ios or macos)'
    required: true
  destination:
    description: 'xcodebuild destination parameter'
    required: true
  artifact-name:
    description: 'Name for the artifact upload'
    required: true
  reference-root:
    description: 'Root directory for persistent UI test reference images'
    required: false
    default: /Volumes/Workspace/OpenSwiftUI_CI/ReferenceImages
  update-reference:
    description: 'Force updating reference images before running UI tests'
    required: false
    default: 'false'
  only-testing:
    description: 'Optional xcodebuild -only-testing identifier, shared by recording and verification'
    required: false
    default: ''
  compute:
    description: 'Generate the Example project with the Compute backend'
    required: false
    default: 'false'

  test-suite:
    description: 'Hosted test suite (UITests or InteractionTests)'
    default: UITests
  record-if-missing:
    description: 'Record a baseline when the test suite has no reference images'
    default: 'true'

outputs:
  test-result:
    description: 'Test execution result (success or failure)'
    value: ${{ steps.uitest.outcome }}

runs:
  using: composite
  steps:
    - name: Setup Xcode
      uses: OpenSwiftUIProject/setup-xcode@v2
      with:
        xcode-version: ${{ inputs.xcode-version }}

    - name: Set up mise
      uses: jdx/mise-action@v4
      with:
        version: 2026.8.14
        install: false
        cache: false

    - name: Set up build environment
      run: Scripts/CI/darwin_setup_build.sh
      shell: bash

    - name: Configure test environment
      shell: bash
      run: |
        {
          echo "TUIST_MISE_ENVIRONMENT=${{ inputs.compute == 'true' && 'compute' || '' }}"
          echo "OPENSWIFTUI_EXAMPLE_LOOKINSIDE_SERVER=0"
          echo "OPENSWIFTUI_EXAMPLE_LOOKIN_SERVER=0"
        } >> "$GITHUB_ENV"

    - name: Set up Tuist
      shell: bash
      run: |
        source Scripts/Tuist/common.sh
        tuist_ci_setup

    - name: Generate Example project
      shell: bash
      run: |
        cd Example
        if [[ "${{ inputs.compute }}" == "true" ]]; then
          ./setup.sh --compute
        else
          ./setup.sh
        fi

    - name: Resolve snapshot reference directory
      id: reference
      shell: bash
      env:
        SNAPSHOT_REFERENCE_ROOT: ${{ inputs.reference-root }}
        TEST_PLATFORM: ${{ inputs.platform }}
        TEST_DESTINATION: ${{ inputs.destination }}
        TEST_SUITE: ${{ inputs.test-suite }}
        UPDATE_REFERENCE: ${{ inputs.update-reference }}
        RECORD_IF_MISSING: ${{ inputs.record-if-missing }}
      run: |
        set -euo pipefail
        case "$TEST_SUITE" in
          UITests|InteractionTests) ;;
          *) echo "::error::Unsupported test suite: $TEST_SUITE"; exit 1 ;;
        esac
        case "$TEST_PLATFORM" in
          macos)
            snapshot_platform="macOS"
            snapshot_version="$(sw_vers -productVersion)"
            ;;
          ios)
            snapshot_platform="iOS_Simulator"
            snapshot_version="$(sed -n 's/.*OS=\([^,]*\).*/\1/p' <<< "$TEST_DESTINATION")"
            ;;
          *) echo "::error::Unsupported test platform: $TEST_PLATFORM"; exit 1 ;;
        esac
        if [[ -z "$snapshot_version" ]]; then
          echo "::error::Unable to resolve OS version from destination: $TEST_DESTINATION"
          exit 1
        fi
        IFS=. read -r major minor patch _ <<< "$snapshot_version"
        snapshot_version="$major.${minor:-0}.${patch:-0}"
        snapshot_reference_platform_dir="$SNAPSHOT_REFERENCE_ROOT/$snapshot_platform"
        snapshot_reference_dir="$snapshot_reference_platform_dir/$snapshot_version/OpenSwiftUI$TEST_SUITE"
        needs_record="$UPDATE_REFERENCE"
        if [[ "$needs_record" != "true" && "$RECORD_IF_MISSING" == "true" ]]; then
          if [[ ! -d "$snapshot_reference_dir" ]] || ! find "$snapshot_reference_dir" -type f -name '*.png' -print -quit | grep -q .; then
            needs_record=true
          fi
        fi
        {
          echo "root=$SNAPSHOT_REFERENCE_ROOT"
          echo "platform-directory=$snapshot_reference_platform_dir"
          echo "directory=$snapshot_reference_dir"
          echo "lockfile=$snapshot_reference_platform_dir/.lock"
          echo "needs-record=$needs_record"
        } >> "$GITHUB_OUTPUT"
        echo "Snapshot reference directory: $snapshot_reference_dir"
        echo "Record SwiftUI baseline: $needs_record"

    - name: Prepare isolated test directories
      id: paths
      shell: bash
      run: |
        test_root="$(mktemp -d "${RUNNER_TEMP:-/tmp}/snapshot-tests.XXXXXX")"
        mkdir -p "$test_root/Artifacts" "$test_root/DerivedData"
        {
          echo "root=$test_root"
          echo "artifacts=$test_root/Artifacts"
          echo "derived-data-path=$test_root/DerivedData"
        } >> "$GITHUB_OUTPUT"

    - name: Record baseline images with SwiftUI
      id: record-baseline
      if: steps.reference.outputs.needs-record == 'true'
      continue-on-error: true
      shell: bash
      env:
        UITEST_ONLY_TESTING: ${{ inputs.only-testing }}
        TEST_RUNNER_SNAPSHOT_REFERENCE_DIR: ${{ steps.reference.outputs.root }}
      run: |
        set -euo pipefail
        source Scripts/Tuist/common.sh
        cd Example
        test_arguments=(-workspace Example.xcworkspace)
        if [[ "${{ inputs.test-suite }}" == "InteractionTests" ]]; then
          test_arguments+=(-parallel-testing-enabled NO)
        fi
        if [[ -n "$UITEST_ONLY_TESTING" ]]; then
          test_arguments+=("-only-testing:$UITEST_ONLY_TESTING")
        fi
        snapshot_reference_platform_dir="${{ steps.reference.outputs.platform-directory }}"
        snapshot_reference_dir="${{ steps.reference.outputs.directory }}"
        lockfile="${{ steps.reference.outputs.lockfile }}"
        lock_nonce="$(uuidgen 2>/dev/null || printf '%s-%s-%s' "$$" "$RANDOM" "$RANDOM")"
        lock_owner="run=${GITHUB_RUN_ID} job=${GITHUB_JOB} attempt=${GITHUB_RUN_ATTEMPT} platform=${{ inputs.platform }} destination=${{ inputs.destination }} nonce=${lock_nonce}"
        {
          echo "lockfile=$lockfile"
          echo "lock-owner=$lock_owner"
        } >> "$GITHUB_OUTPUT"
        mkdir -p "$snapshot_reference_platform_dir"

        remove_current_lock() {
          if [[ -f "$lockfile" ]] && [[ "$(cat "$lockfile" 2>/dev/null || true)" == "$lock_owner" ]]; then
            rm -f "$lockfile"
          fi
        }

        remove_completed_run_lock() {
          if [[ ! -f "$lockfile" ]]; then
            return
          fi

          local existing_lock existing_run existing_status
          existing_lock="$(cat "$lockfile" 2>/dev/null || true)"
          existing_run="$(sed -n 's/^run=\([^ ]*\).*/\1/p' <<< "$existing_lock")"
          if [[ -z "$existing_run" ]] || ! command -v gh >/dev/null 2>&1; then
            return
          fi

          existing_status="$(gh run view "$existing_run" --repo "$GITHUB_REPOSITORY" --json status --jq .status 2>/dev/null || true)"
          if [[ "$existing_status" == "completed" ]] && [[ "$(cat "$lockfile" 2>/dev/null || true)" == "$existing_lock" ]]; then
            echo "::notice::Removing stale snapshot reference lock from completed run $existing_run."
            rm -f "$lockfile"
          fi
        }

        acquire_lock() {
          ( set -o noclobber; printf '%s\n' "$lock_owner" > "$lockfile" ) 2>/dev/null
        }

        # Baseline images are shared by every configuration for a platform, so
        # parallel matrix jobs must wait for the current recorder to finish.
        lock_wait_timeout_seconds=1800
        lock_poll_interval_seconds=10
        lock_wait_started=$SECONDS
        next_lock_notice_at=0
        while true; do
          remove_completed_run_lock
          if acquire_lock; then
            break
          fi

          lock_wait_elapsed=$((SECONDS - lock_wait_started))
          existing_lock="$(cat "$lockfile" 2>/dev/null || echo "another snapshot test run")"
          if (( lock_wait_elapsed >= lock_wait_timeout_seconds )); then
            echo "::error::Timed out after ${lock_wait_timeout_seconds}s waiting for snapshot reference images locked by $existing_lock."
            exit 1
          fi
          if (( lock_wait_elapsed >= next_lock_notice_at )); then
            echo "::notice::Snapshot reference images are locked by $existing_lock; retrying every ${lock_poll_interval_seconds}s for up to ${lock_wait_timeout_seconds}s."
            next_lock_notice_at=$((lock_wait_elapsed + 60))
          fi
          sleep "$lock_poll_interval_seconds"
        done
        trap remove_current_lock EXIT INT TERM

        result_bundle="${{ steps.paths.outputs.artifacts }}/SUI_${{ inputs.test-suite }}.xcresult"
        test_log="${{ steps.paths.outputs.artifacts }}/SUI_${{ inputs.test-suite }}.log"
        record_status=0
        NSUnbufferedIO=YES tuist_xcodebuild "$result_bundle" test \
          -scheme "SUI_${{ inputs.test-suite }}" \
          -destination "${{ inputs.destination }}" \
          -skipMacroValidation \
          -skipPackagePluginValidation \
          -derivedDataPath "${{ steps.paths.outputs.derived-data-path }}" \
          "${test_arguments[@]}" \
          2>&1 | tee "$test_log" || record_status=$?

        result_mode=verify
        # Tuist reports xcodebuild test failures as exit status 1.
        if [[ "$record_status" -eq 1 || "$record_status" -eq 65 ]]; then
          result_mode=record
        elif [[ "$record_status" -ne 0 ]]; then
          exit "$record_status"
        fi
        bash ../Scripts/CI/check_uitest_selection.sh "$result_bundle" "${UITEST_ONLY_TESTING:-SUI_${{ inputs.test-suite }}}" "$result_mode" 2>&1 | tee -a "$test_log"
        if [[ "$result_mode" == record ]] && { [[ ! -d "$snapshot_reference_dir" ]] || ! find "$snapshot_reference_dir" -type f -name '*.png' -print -quit | grep -q .; }; then
          echo "::error::SwiftUI did not record snapshot reference images in $snapshot_reference_dir." | tee -a "$test_log"
          exit 1
        fi

    - name: Clean up snapshot reference lock
      if: always() && steps.reference.outputs.needs-record == 'true'
      shell: bash
      run: |
        lockfile="${{ steps.record-baseline.outputs.lockfile }}"
        lock_owner="${{ steps.record-baseline.outputs.lock-owner }}"
        if [[ -n "$lockfile" ]] && [[ -f "$lockfile" ]] && [[ "$(cat "$lockfile" 2>/dev/null || true)" == "$lock_owner" ]]; then
          rm -f "$lockfile"
        fi

    - name: Fail if baseline recording failed
      if: steps.record-baseline.outcome == 'failure'
      shell: bash
      run: exit 1

    - name: Run tests with OpenSwiftUI
      id: uitest
      continue-on-error: true
      shell: bash
      env:
        UITEST_ONLY_TESTING: ${{ inputs.only-testing }}
        TEST_RUNNER_SNAPSHOT_REFERENCE_DIR: ${{ steps.reference.outputs.root }}
      run: |
        set -euo pipefail
        source Scripts/Tuist/common.sh
        cd Example
        test_arguments=(-workspace Example.xcworkspace)
        if [[ "${{ inputs.test-suite }}" == "InteractionTests" ]]; then
          test_arguments+=(-parallel-testing-enabled NO)
        fi
        if [[ -n "$UITEST_ONLY_TESTING" ]]; then
          test_arguments+=("-only-testing:$UITEST_ONLY_TESTING")
        fi
        result_bundle="${{ steps.paths.outputs.artifacts }}/OSUI_${{ inputs.test-suite }}.xcresult"
        test_log="${{ steps.paths.outputs.artifacts }}/OSUI_${{ inputs.test-suite }}.log"
        test_status=0
        NSUnbufferedIO=YES tuist_xcodebuild "$result_bundle" test \
          -scheme "OSUI_${{ inputs.test-suite }}" \
          -destination "${{ inputs.destination }}" \
          -skipMacroValidation \
          -skipPackagePluginValidation \
          -derivedDataPath "${{ steps.paths.outputs.derived-data-path }}" \
          "${test_arguments[@]}" \
          2>&1 | tee "$test_log" || test_status=$?
        if [[ "$test_status" -ne 0 && ! -d "$result_bundle" ]]; then
          exit "$test_status"
        fi
        bash ../Scripts/CI/check_uitest_selection.sh "$result_bundle" "${UITEST_ONLY_TESTING:-OSUI_${{ inputs.test-suite }}}" 2>&1 | tee -a "$test_log"
        exit "$test_status"

    - name: Collect failure artifacts
      if: always() && steps.paths.outputs.artifacts != '' && (steps.record-baseline.outcome == 'failure' || steps.uitest.outcome == 'failure')
      shell: bash
      env:
        TEST_ARTIFACTS: ${{ steps.paths.outputs.artifacts }}
      run: |
        set -euo pipefail
        for test_log in "$TEST_ARTIFACTS"/*.log; do
          [[ -f "$test_log" ]] || continue
          name="$(basename "$test_log" .log)"
          Scripts/CI/collect_uitest_failures.sh "$test_log" "$TEST_ARTIFACTS/$name"
        done
        cd "$TEST_ARTIFACTS"
        for result_bundle in *.xcresult; do
          [[ -d "$result_bundle" ]] || continue
          zip -r -q "$result_bundle.zip" "$result_bundle"
          rm -rf "$result_bundle"
        done

    - name: Upload test artifacts
      if: always() && steps.paths.outputs.artifacts != '' && (steps.record-baseline.outcome == 'failure' || steps.uitest.outcome == 'failure')
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.paths.outputs.artifacts }}
        retention-days: 7

    - name: Clean up isolated test directories
      if: always() && steps.paths.outputs.root != ''
      shell: bash
      env:
        TEST_ROOT: ${{ steps.paths.outputs.root }}
      run: rm -rf "$TEST_ROOT"
