name: Run UX Tests
description: Execute hosted snapshot tests and collect failure artifacts

inputs:
  xcode-version:
    description: 'Xcode version to use'
    required: false
    default: '26.6'
  platform:
    description: 'Platform to test (ios or macos)'
    required: true
  destination:
    description: 'xcodebuild destination parameter'
    required: true
  artifact-name:
    description: 'Name for the artifact upload'
    required: true
  reference-root:
    description: 'Root directory for persistent UX test reference images'
    required: false
    default: /Volumes/Workspace/OpenSwiftUI_CI/ReferenceImages
  update-reference:
    description: 'Force updating reference images before running UX tests'
    required: false
    default: 'false'
  only-testing:
    description: 'Optional xcodebuild -only-testing identifier, shared by recording and verification'
    required: false
    default: ''
  compute:
    description: 'Generate the Example project with the Compute backend'
    required: false
    default: 'false'

outputs:
  test-result:
    description: Test execution result (success or failure)
    value: ${{ steps.tests.outputs.test-result }}

runs:
  using: composite
  steps:
    - name: Run UX snapshot tests
      id: tests
      uses: ./.github/actions/uitests
      with:
        xcode-version: ${{ inputs.xcode-version }}
        platform: ${{ inputs.platform }}
        destination: ${{ inputs.destination }}
        artifact-name: ${{ inputs.artifact-name }}
        reference-root: ${{ inputs.reference-root }}
        update-reference: ${{ inputs.update-reference }}
        only-testing: ${{ inputs.only-testing }}
        compute: ${{ inputs.compute }}
        test-suite: UXTests
        record-if-missing: 'false'
