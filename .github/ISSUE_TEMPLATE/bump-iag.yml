name: Bump IAG
description: Track an upgrade of OpenSwiftUI's Compute-backed IAG integration.
title: "Bump IAG to "
labels:
  - "type: maintenance"
  - "area: graph"
body:
  - type: markdown
    attributes:
      value: |
        IAG refers to the Compute backend used by OpenSwiftUI's attribute graph shims. Use this form to propose an upgrade, record its binary and source targets, and define the expected behavior and compatibility impact.

        When implementing the upgrade, use [`.github/PULL_REQUEST_TEMPLATE/bump-iag.md`](https://github.com/OpenSwiftUIProject/OpenSwiftUI/blob/main/.github/PULL_REQUEST_TEMPLATE/bump-iag.md) as the pull request template.

  - type: input
    id: current-binary-version
    attributes:
      label: Current binary version
      description: The Compute binary version currently pinned in `mise.compute.toml`.
      placeholder: "0.5.2"
    validations:
      required: true

  - type: input
    id: target-binary-version
    attributes:
      label: Target binary version
      description: The proposed Compute binary version. Enter "Unchanged" if this pin does not move.
      placeholder: "0.6.0"
    validations:
      required: true

  - type: input
    id: current-source-version
    attributes:
      label: Current source version
      description: The Compute source tag or revision currently pinned in `mise.compute.toml`.
      placeholder: "0.5.2"
    validations:
      required: true

  - type: input
    id: target-source-version
    attributes:
      label: Target source version
      description: The proposed Compute source tag or revision. Enter "Unchanged" if this pin does not move.
      placeholder: "0.6.0"
    validations:
      required: true

  - type: input
    id: upstream-reference
    attributes:
      label: Upstream release or revision
      description: Link the Compute release, tag, commit, or pull request being adopted.
      placeholder: "https://github.com/OpenSwiftUIProject/Compute/releases/tag/..."
    validations:
      required: true

  - type: textarea
    id: upgrade-motivation
    attributes:
      label: Upgrade motivation
      description: Explain why the upgrade should be scheduled, linking relevant Compute and OpenSwiftUI issues.
      placeholder: |
        - Fixes ...
        - Includes OpenSwiftUIProject/Compute#...
        - Unblocks OpenSwiftUIProject/OpenSwiftUI#...
    validations:
      required: true

  - type: textarea
    id: expected-impact
    attributes:
      label: Expected behavior and compatibility impact
      description: Describe anticipated ABI, deployment target, Swift toolchain, snapshot, or graph behavior changes that will need review.
      placeholder: Describe the expected impact or write "None".
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Define the outcomes required before the tracking issue can be closed. Keep implementation and validation steps in the matching pull request template.
      placeholder: |
        - Binary and source pins use the intended Compute release.
        - Compute-backed targets build on supported platforms.
        - Graph behavior and snapshot changes are reviewed and accounted for.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add logs, benchmark results, snapshot comparisons, or rollout notes.
    validations:
      required: false
