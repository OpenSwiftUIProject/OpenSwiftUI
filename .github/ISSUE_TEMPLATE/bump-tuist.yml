name: Bump Tuist
description: Track an upgrade of the Tuist CLI used to generate OpenSwiftUI projects.
title: "Bump Tuist to "
labels:
  - "type: build"
  - "area: tooling"
body:
  - type: markdown
    attributes:
      value: |
        Use this form to propose a Tuist upgrade, record the upstream motivation, and define the expected impact across both OpenSwiftUI generation environments.

        When implementing the upgrade, use [`.github/PULL_REQUEST_TEMPLATE/bump-tuist.md`](https://github.com/OpenSwiftUIProject/OpenSwiftUI/blob/main/.github/PULL_REQUEST_TEMPLATE/bump-tuist.md) as the pull request template.

  - type: input
    id: current-version
    attributes:
      label: Current version
      description: The Tuist version currently pinned by OpenSwiftUI.
      placeholder: "4.203.4"
    validations:
      required: true

  - type: input
    id: target-version
    attributes:
      label: Target version
      description: The Tuist version this issue proposes adopting.
      placeholder: "4.206.0"
    validations:
      required: true

  - type: input
    id: upstream-reference
    attributes:
      label: Upstream release or pull request
      description: Link the Tuist release, changelog, or pull request that contains the relevant changes.
      placeholder: "https://github.com/tuist/tuist/releases/tag/4.206.0"
    validations:
      required: true

  - type: textarea
    id: upgrade-motivation
    attributes:
      label: Upgrade motivation
      description: Explain why the upgrade should be scheduled and link the affected upstream and OpenSwiftUI issues.
      placeholder: |
        - Fixes ...
        - Includes tuist/tuist#...
        - Unblocks OpenSwiftUIProject/OpenSwiftUI#...
    validations:
      required: true

  - type: textarea
    id: expected-impact
    attributes:
      label: Expected compatibility and migration impact
      description: Describe anticipated manifest changes, generated-project differences, deprecations, or workarounds that may become removable.
      placeholder: Describe the expected impact or write "None".
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Define the outcomes required before the tracking issue can be closed. Keep implementation and validation steps in the matching pull request template.
      placeholder: |
        - Both Tuist pins use the target version.
        - Default and Compute project generation remain usable.
        - Version-specific workarounds are removed or documented.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add logs, generated-project diffs, or other information useful during the upgrade.
    validations:
      required: false
