buildscript {
    ext.kotlin_version = '2.2.20'
    ext.agp_version = '8.13.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// SwiftPM owns the source checkout. Keep Gradle outputs out of it.
project(':uikit').buildDir = new File(rootProject.projectDir, 'build/uikit')

task clean(type: Delete) {
    delete rootProject.buildDir
}
